name: CI - Code Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Go 代码检查
  go-check:
    name: Go Code Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Download and tidy dependencies
        run: |
          go mod tidy
          go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Code is not properly formatted. Run 'gofmt -w .'"
            exit 1
          fi

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out || true

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore

  # 前端代码检查
  web-check:
    name: Web Code Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Check linting
        run: npm run lint 2>/dev/null || echo "No lint script defined"

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
