version: '3.8'

services:
  quark-mobile:
    # 使用远程镜像
    image: ghcr.io/zixiang0520/quark-mobile:latest
    container_name: quark-mobile
    
    # 端口映射
    ports:
      - "18900:18900"
    
    # 数据持久化
    volumes:
      - quark-mobile-data:/data
    
    # 环境变量配置
    environment:
      # 服务器配置
      - CONFIG_PATH=/app/config.yaml
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      
      # OpenList 连接配置
      - OL_BASE_URL=http://vip.dsj6.cn:5244
      - OL_USERNAME=lk0520
      - OL_PASSWORD=ZXliukai123
      
      # 挂载路径
      - OL_MOUNT_QUARK=/quark
      - OL_MOUNT_MOBILE=/mobile
    
    # 自动重启
    restart: unless-stopped
    
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:18900/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    
    # 网络配置
    networks:
      - quark-mobile-net

networks:
  quark-mobile-net:
    driver: bridge

volumes:
  quark-mobile-data:
    driver: local
